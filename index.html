<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task list</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e6d2d6 0%, #bb258c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .hero-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        
        .content {
            padding: 40px;
            width: 100%;
        }
        
        .content h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-align: center;
        }
        
        .task-list {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .task-list ul {
            list-style: none;
        }
        
        .task-list li {
            background: #f8f9fa;
            margin: 12px 0;
            padding: 20px 24px;
            border-radius: 12px;
            border-left: 5px solid #e6e9d6;
            font-size: 1.1em;
            color: #444;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .task-list li:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .task-list li.completed {
            border-left-color: #28a745;
            background: #e9f7ef;
            text-decoration: line-through;
            color: #888;
        }
        
        .task-list li.completed:hover {
            transform: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .task-list input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            cursor: pointer;
        }
        
        .task-item {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Big Hero Image -->
        <img src="src/welcome.jpg"
             alt="Task management workspace" 
             class="hero-image">
        
        <!-- Content with Task List -->
        <div class="content">
            <h1>Vítej</h1>
            
            <div class="task-list">
                <ul>
                    <li>
                        <div class="task-item">
                            <input type="checkbox" id="task1">
                            <label for="task1">Přijď domů</label>
                        </div>
                    </li>
                    <li>
                        <div class="task-item">
                            <input type="checkbox" id="task2">
                            <label for="task2">Udělej čaj</label>
                        </div>
                    </li>
                    <li>
                        <div class="task-item">
                            <input type="checkbox" id="task3">
                            <label for="task3">Sedni si ke mě</label>
                        </div>
                    </li>
                    <li>
                        <div class="task-item">
                            <input type="checkbox" id="task4">
                            <label for="task4">Užívej</label>
                        </div>
                    </li>
                    <li>
                        <div class="task-item">
                            <input type="checkbox" id="task5">
                            <label for="task5">dej mi pusu</label>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
